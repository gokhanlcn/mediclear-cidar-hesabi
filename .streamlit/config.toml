# Not: yerel başlatıcılar (baslat.bat/.sh) ayrıca --server.address localhost verir;
# burada verilmez ki Streamlit Community Cloud'da uygulama dışarıdan erişilebilsin.

[theme]
primaryColor = "#1F6FB2"
